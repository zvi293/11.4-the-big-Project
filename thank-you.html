<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You · NZ Web</title>
    <meta
      name="description"
      content="Thank you for contacting NZ Web by Zvi Moshe. Your message has been received."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://nz-web.netlify.app/thank-you.html" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="thank-you-section" aria-label="Thank you confirmation">
      <div class="thank-you-card">
        <div class="check-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="thank-you-title">Message <em style="font-style:italic;background:linear-gradient(120deg,var(--gold-1),var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent;">received.</em></h1>
        <p class="thank-you-message">
          Thanks for reaching out. I read every message personally and you'll hear back from me
          within one business day — usually faster.
        </p>
        <a href="/" class="back-btn">
          Back to the studio
          <span class="arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </span>
        </a>
      </div>
    </section>

    <footer class="site-footer" aria-label="Footer">
      <div class="container">
        <div class="footer-bottom" style="border-top:0">
          <span>© 2026 NZ Web · All rights reserved</span>
          <div class="legal">
            <a href="./privacy-policy.html">Privacy</a>
            <a href="./terms.html">Terms</a>
          </div>
          <a href="/" class="top-link">Back to home</a>
        </div>
      </div>
    </footer>
  </body>
</html>
