<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NZ Web share image">
  <title>NZ Web - Hand-Coded Websites and Landing Pages - Studio of Zvi Moshe</title>
  <desc>Independent studio. Tel Aviv, worldwide. No templates, no filler.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe9c4"/>
      <stop offset="35%" stop-color="#f5deb3"/>
      <stop offset="65%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b58a4f"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe9c4"/>
      <stop offset="50%" stop-color="#e3c78c"/>
      <stop offset="100%" stop-color="#a87a3e"/>
    </linearGradient>
    <linearGradient id="boneText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#c9b990"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b58a4f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5deb3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b58a4f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1d1d1d" stroke-width="0.6"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)" opacity="0.55"/>
  <rect x="28" y="28" width="1144" height="574" rx="14" ry="14" fill="none" stroke="#262626" stroke-width="1"/>
