  <g font-family="Liberation Mono, Courier New, monospace">
    <line x1="72" y1="548" x2="1128" y2="548" stroke="#1d1d1d" stroke-width="1"/>
    <text x="72" y="580" font-size="14" fill="#cfc7b6"><tspan fill="#8b867b">--</tspan> No templates. No filler. Just considered work, shipped.</text>
    <text x="1128" y="580" font-size="14" text-anchor="end" fill="url(#goldFill)" font-weight="700">nz-web.netlify.app</text>
