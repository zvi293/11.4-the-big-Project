  <circle cx="600" cy="408" r="4" fill="#f5deb3"/>
  <g font-family="Liberation Sans, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="466" font-size="40" font-weight="700" letter-spacing="-0.5" fill="url(#boneText)">Hand-Coded Websites &amp; Landing Pages</text>
    <text x="600" y="500" font-size="16" font-weight="500" letter-spacing="4" fill="#8b867b">STUDIO OF ZVI MOSHE . TEL AVIV . WORLDWIDE</text>
