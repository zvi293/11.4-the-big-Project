# =====================================================================
# NZ WEB — Netlify configuration
# =====================================================================

[build]
  publish = "."

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Force HTTPS (Netlify does this automatically, but explicit is nice)
[[redirects]]
  from = "http://nz-web.netlify.app/*"
  to = "https://nz-web.netlify.app/:splat"
  status = 301
  force = true

# Cache policy for static assets
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
