# Zstore AI — "One Ribbon" (nz-web.netlify.app)
# Static site: no build step, publish straight from the repo root.

[build]
  publish = "."

# Security headers for every response. The CSP mirrors the <meta> tag in each page
# (kept in both places: the header covers assets and adds frame-ancestors).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Internal project files (docs, local tooling, QA suite) are not part of the website:
# serve the 404 page for them. `force` makes the rule win over the deployed file.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CONCEPT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.cjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/START.cmd"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# RFC 9116 security contact: the canonical /.well-known/ path serves the root file.
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# --- Form-flood rate limiting (server-side, per IP per domain) ---------------
# Netlify accepts form POSTs on any path, so path rules cannot be airtight;
# these three cover the targets every real-world bot uses — the form's own
# action URL (/thank-you*) and the documented AJAX target ("/"). Limits are
# far above anything a human, Googlebot or PageSpeed ever sends for a single
# path, so normal traffic and SEO are untouched; excess returns 429.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  [redirects.rate_limit]
    window_size = 180
    window_limit = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200
  force = true
  [redirects.rate_limit]
    window_size = 180
    window_limit = 30
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you.html"
  status = 200
  force = true
  [redirects.rate_limit]
    window_size = 180
    window_limit = 30
    aggregate_by = ["ip", "domain"]

# Fonts and images never change without a rename — cache for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML / CSS / JS stay on Netlify's default (etag revalidation),
# so every deploy is visible immediately.
